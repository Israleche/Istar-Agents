name: Bug report
description: Report a problem with the Istar Code agent kernel or documentation
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the
        sections below so we can reproduce and fix the issue quickly.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: The agent skipped the VERIFY phase when...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Load istar-code.md into the agent runtime
        2. Send a prompt that...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part is affected?
      options:
        - Kernel (istar-code.md)
        - Documentation (README.md)
        - Install / integration
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kernel version
      description: Version from the istar-code.md frontmatter.
      placeholder: 5.0.0
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I have not included any API keys, tokens, or secrets.
          required: true
